<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- ======================================================================
     KUUNTELUSIVU — piilotettu

     Tarkoitettu jaettavaksi ennen julkaisua, mutta tekstit on kirjoitettu
     niin että sivun voi jättää elämään myös julkaisun jälkeen.

     Uudelleenkäyttö jokaiselle julkaisulle: muuta vain nämä neljä kohtaa.
       1) <title> ja biisin nimi (.song)      → hae "MUUTA:"
       2) julkaisupäivä (.release)            → hae "MUUTA:"
       3) audiotiedosto (<audio src=...>)     → hae "MUUTA:"
       4) aksenttiväri (--accent / -deep)     → petroli nyt; vaihda kanteen

     Sijoitus: pudota tämä kansio sivuston juureen omalla arvaamattomalla
     nimellä, esim.  /kuuntelu-x7k2m9/  ja jaa linkki vain uutiskirjeessä.
     Sivu ei näy navigaatiossa, ei sitemapissa, ja on merkitty noindex.
     ====================================================================== -->

<title>Kauneinta mitä sus on — Meretniemi</title><!-- MUUTA: biisin nimi -->

<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Kuuntele.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

<style>
:root{
  --paper:#FBFAF8;
  --paper-warm:#F3EFE8;
  --ink:#16120E;
  --ink-soft:#6E675E;
  --rule:#E6E1D9;

  /* MUUTA: singlen aksenttiväri. Petroli = Kauneinta mitä sus on. */
  --accent:#0B6870;
  --accent-deep:#0A565C;

  --serif:"EB Garamond","Hoefler Text",Georgia,"Times New Roman",serif;
  --sans:"Helvetica Neue",Helvetica,Arial,"Liberation Sans",sans-serif;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  min-height:100svh;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--serif);
  font-size:clamp(1.0625rem,.98rem + .42vw,1.25rem);
  line-height:1.62;
  -webkit-font-smoothing:antialiased;
  display:flex;
  flex-direction:column;
}
img{display:block;max-width:100%;height:auto}
a{color:inherit}
::selection{background:var(--accent);color:#fff}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:1px}

/* ---------- Nimimerkki: samat arvot kuin index-sivun tyyli.css ---------- */
.topbar{
  display:flex;
  align-items:baseline;
  padding:2rem clamp(1.5rem,5vw,4.5rem) 0;
}
.wordmark{
  font-family:var(--sans);
  font-size:.8125rem;
  font-weight:700;
  letter-spacing:.3em;
  text-transform:uppercase;
  text-decoration:none;
  color:var(--ink);
}

/* ---------- Keskus ---------- */
.wrap{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:clamp(2.5rem,7vh,5.5rem) clamp(1.5rem,5vw,4.5rem);
}
.card{
  width:100%;
  max-width:31rem;
  text-align:center;
}

.eyebrow{
  font-family:var(--sans);
  font-size:.6875rem;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--accent);
  margin:0 0 1.6rem;
}

/* Kansi + hennosti hengittävä valokeila (sivuston tunnus) */
.cover{
  display:block;
  border:0;
  padding:0;
  background:none;
  position:relative;
  width:min(17rem,66vw);
  margin:0 auto 1.9rem;
  aspect-ratio:1;
  cursor:zoom-in;
}
.cover::before{
  content:"";
  position:absolute;
  inset:-14%;
  border-radius:50%;
  background:radial-gradient(circle at 50% 42%,
    color-mix(in srgb,var(--accent) 26%,transparent) 0%,
    transparent 62%);
  opacity:0;
  transition:opacity 1.4s ease;
  z-index:0;
}
.cover img{
  position:relative;
  z-index:1;
  width:100%;
  height:100%;
  object-fit:cover;
  box-shadow:0 1px 0 rgba(0,0,0,.05),0 22px 48px -28px rgba(11,104,112,.5);
}
body.playing .cover::before{opacity:1;animation:breathe 9s ease-in-out infinite alternate}
@keyframes breathe{from{opacity:.5}to{opacity:1}}

.song{
  font-weight:400;
  font-size:clamp(1.9rem,1.1rem + 3.1vw,2.9rem);
  line-height:1.1;
  letter-spacing:-.01em;
  margin:0 0 .55rem;
}
.intro{
  font-style:italic;
  color:var(--ink-soft);
  line-height:1.5;
  margin:0 auto 2.2rem;
  max-width:30rem;
  text-wrap:balance;
}

/* ---------- Soitin: natiivi selainsoitin, kuten Medialle-sivulla ---------- */
audio{
  width:100%;
  max-width:30rem;
  margin:0 auto;
  display:block;
}
audio::-webkit-media-controls-panel{background:var(--paper)}

/* ---------- Julkaisurivi ---------- */
.release{
  margin:2.3rem 0 0;
  color:var(--ink-soft);
  font-size:.95rem;
}

/* ---------- Kannen suurennus ---------- */
.lightbox{
  position:fixed;
  inset:0;
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:clamp(1.5rem,5vw,4rem);
  background:rgba(11,9,8,.88);
  cursor:zoom-out;
  animation:fade .25s ease;
}
.lightbox[hidden]{display:none}
.lightbox img{
  width:auto;
  height:auto;
  max-width:min(90vw,40rem);
  max-height:90vh;
  object-fit:contain;
  box-shadow:0 30px 80px -20px rgba(0,0,0,.6);
}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ---------- Alapalkki ---------- */
.foot{
  padding:0 clamp(1.5rem,5vw,4.5rem) 2.3rem;
  text-align:center;
  font-family:var(--sans);
  font-size:.625rem;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--ink-soft);
}

@media (prefers-reduced-motion:reduce){
  body.playing .cover::before{animation:none}
  .lightbox{animation:none}
  *{transition:none!important}
}
</style>
</head>

<body>
  <header class="topbar">
    <a class="wordmark" href="https://meretniemimusic.fi/">Meretniemi</a>
  </header>

  <main class="wrap">
    <div class="card">
      <p class="eyebrow">Kuuntele</p>

      <button class="cover" id="cover" type="button" aria-label="Suurenna kansi">
        <img src="/kuvat/kansi.jpg" alt="Kauneinta mitä sus on – singlen kansi"
             onerror="this.style.visibility='hidden'">

      </button>

      <!-- MUUTA: biisin nimi -->
      <h1 class="song">Kauneinta mitä sus on</h1>

      <p class="intro">Voi kun et himmentäisi enää tota loistoa sussa<br>
        ei sinivuokkokaan voi elää terälehdet nupussa</p>

      <!-- MUUTA: audiotiedosto -->
      <audio id="audio" controls preload="metadata"
             controlsList="nodownload" oncontextmenu="return false"
             src="Meretniemi-Kauneinta-mita-sus-on.mp3">
        Selaimesi ei tue äänisoitinta.
      </audio>

      <p class="release">
        <!-- MUUTA: julkaisupäivä -->
        Julkaisupäivä 21. elokuuta 2026.
      </p>
    </div>
  </main>

  <footer class="foot">Meretniemi · Has Been Records</footer>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Singlen kansi" hidden>
    <img src="/kuvat/kansi.jpg" alt="Kauneinta mitä sus on – singlen kansi">
  </div>

<script>
  // Sytyttää valokeilan kannen taakse, kun laulu soi.
  (function(){
    var a = document.getElementById('audio');
    if(!a) return;
    var on  = function(){ document.body.classList.add('playing'); };
    var off = function(){ document.body.classList.remove('playing'); };
    a.addEventListener('play', on);
    a.addEventListener('pause', off);
    a.addEventListener('ended', off);
  })();

  // Kannen suurennus: klikkaus avaa, klikkaus tai Esc sulkee.
  (function(){
    var cover = document.getElementById('cover');
    var lb    = document.getElementById('lightbox');
    if(!cover || !lb) return;
    var onKey = function(e){ if(e.key === 'Escape') close(); };
    function open(){ lb.hidden = false; document.addEventListener('keydown', onKey); }
    function close(){ lb.hidden = true; document.removeEventListener('keydown', onKey); cover.focus(); }
    cover.addEventListener('click', open);
    lb.addEventListener('click', close);
  })();
</script>
</body>
</html>
