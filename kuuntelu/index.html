<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- ======================================================================
     KUUNTELUSIVU — piilotettu

     Tarkoitettu jaettavaksi ennen julkaisua, mutta tekstit on kirjoitettu
     niin että sivun voi jättää elämään myös julkaisun jälkeen.

     Uudelleenkäyttö jokaiselle julkaisulle: muuta vain nämä neljä kohtaa.
       1) <title> ja biisin nimi (.song)      → hae "MUUTA:"
       2) julkaisupäivä (.release)            → hae "MUUTA:"
       3) audiotiedosto (<source src=...>)    → hae "MUUTA:"
       4) aksenttiväri (--accent / -deep)     → petroli nyt; vaihda kanteen

     Sijoitus: pudota tämä kansio sivuston juureen omalla arvaamattomalla
     nimellä, esim.  /kuuntelu-x7k2m9/  ja jaa linkki vain uutiskirjeessä.
     Sivu ei näy navigaatiossa, ei sitemapissa, ja on merkitty noindex.
     ====================================================================== -->

<title>Kauneinta mitä sus on — Meretniemi</title><!-- MUUTA: biisin nimi -->

<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Kuuntele.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

<style>
:root{
  --paper:#FBFAF8;
  --paper-warm:#F3EFE8;
  --ink:#16120E;
  --ink-soft:#6E675E;
  --rule:#E6E1D9;

  /* MUUTA: singlen aksenttiväri. Petroli = Kauneinta mitä sus on. */
  --accent:#0B6870;
  --accent-deep:#0A565C;

  --serif:"EB Garamond","Hoefler Text",Georgia,"Times New Roman",serif;
  --sans:"Helvetica Neue",Helvetica,Arial,"Liberation Sans",sans-serif;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  min-height:100svh;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--serif);
  font-size:clamp(1.0625rem,.98rem + .42vw,1.25rem);
  line-height:1.62;
  -webkit-font-smoothing:antialiased;
  display:flex;
  flex-direction:column;
}
img{display:block;max-width:100%;height:auto}
a{color:inherit}
::selection{background:var(--accent);color:#fff}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:1px}

/* ---------- Yläpalkki: pelkkä nimimerkki ---------- */
.topbar{
  padding:2rem clamp(1.5rem,5vw,4.5rem) 0;
}
.wordmark{
  font-family:var(--sans);
  font-size:.8125rem;
  letter-spacing:.34em;
  text-transform:uppercase;
  text-decoration:none;
  color:var(--ink);
}

/* ---------- Keskus ---------- */
.wrap{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:clamp(2.5rem,7vh,5.5rem) clamp(1.5rem,5vw,4.5rem);
}
.card{
  width:100%;
  max-width:31rem;
  text-align:center;
}

.eyebrow{
  font-family:var(--sans);
  font-size:.6875rem;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--accent);
  margin:0 0 1.6rem;
}

/* Kansi + hennosti hengittävä valokeila (sivuston tunnus) */
.cover{
  position:relative;
  width:min(17rem,66vw);
  margin:0 auto 1.9rem;
  aspect-ratio:1;
}
.cover::before{
  content:"";
  position:absolute;
  inset:-14%;
  border-radius:50%;
  background:radial-gradient(circle at 50% 42%,
    color-mix(in srgb,var(--accent) 26%,transparent) 0%,
    transparent 62%);
  opacity:0;
  transition:opacity 1.4s ease;
  z-index:0;
}
.cover img{
  position:relative;
  z-index:1;
  width:100%;
  height:100%;
  object-fit:cover;
  box-shadow:0 1px 0 rgba(0,0,0,.05),0 22px 48px -28px rgba(11,104,112,.5);
}
body.playing .cover::before{opacity:1;animation:breathe 9s ease-in-out infinite alternate}
@keyframes breathe{from{opacity:.5}to{opacity:1}}

.song{
  font-weight:400;
  font-size:clamp(1.9rem,1.1rem + 3.1vw,2.9rem);
  line-height:1.1;
  letter-spacing:-.01em;
  margin:0 0 .55rem;
}
.intro{
  font-style:italic;
  color:var(--ink-soft);
  line-height:1.5;
  margin:0 auto 2.2rem;
  max-width:30rem;
  text-wrap:balance;
}

/* ---------- Soitin ---------- */
.player{
  background:var(--paper-warm);
  border:1px solid var(--rule);
  padding:1.5rem 1.5rem 1.35rem;
  display:flex;
  align-items:center;
  gap:1.15rem;
  text-align:left;
}
.play{
  flex:0 0 auto;
  width:3.5rem;
  height:3.5rem;
  border-radius:50%;
  border:0;
  background:var(--accent);
  color:#fff;
  cursor:pointer;
  display:grid;
  place-items:center;
  transition:background .2s ease,transform .1s ease;
}
.play:hover{background:var(--accent-deep)}
.play:active{transform:scale(.96)}
.play svg{width:1.4rem;height:1.4rem;fill:currentColor;pointer-events:none}
.play .ico-pause{display:none}
body.playing .play .ico-play{display:none}
body.playing .play .ico-pause{display:block}

.meter{flex:1;min-width:0}
.bar{
  position:relative;
  height:.5rem;
  border-radius:99px;
  background:var(--rule);
  cursor:pointer;
  touch-action:none;
}
.bar:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.fill{
  position:absolute;
  inset:0 auto 0 0;
  width:0%;
  border-radius:99px;
  background:var(--accent);
}
.knob{
  position:absolute;
  top:50%;
  left:0%;
  width:.85rem;
  height:.85rem;
  border-radius:50%;
  background:var(--accent-deep);
  transform:translate(-50%,-50%);
  box-shadow:0 0 0 3px var(--paper-warm);
}
.times{
  display:flex;
  justify-content:space-between;
  font-family:var(--sans);
  font-size:.7rem;
  letter-spacing:.04em;
  font-variant-numeric:tabular-nums;
  color:var(--ink-soft);
  margin-top:.7rem;
}

/* ---------- Julkaisurivi ---------- */
.release{
  margin:2.3rem 0 0;
  color:var(--ink-soft);
  font-size:.95rem;
}
.release .link-out{
  display:inline-block;
  margin-top:.9rem;
  font-family:var(--sans);
  font-size:.6875rem;
  letter-spacing:.18em;
  text-transform:uppercase;
  text-decoration:none;
  color:var(--ink);
  padding-bottom:.2rem;
  border-bottom:1px solid var(--accent);
  transition:color .2s ease;
}
.release .link-out:hover{color:var(--accent)}

/* ---------- Alapalkki ---------- */
.foot{
  padding:0 clamp(1.5rem,5vw,4.5rem) 2.3rem;
  text-align:center;
  font-family:var(--sans);
  font-size:.625rem;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--ink-soft);
}

@media (max-width:30rem){
  .player{gap:1rem;padding:1.25rem}
  .play{width:3.1rem;height:3.1rem}
}
@media (prefers-reduced-motion:reduce){
  body.playing .cover::before{animation:none}
  *{transition:none!important}
}
</style>
</head>

<body>
  <header class="topbar">
    <a class="wordmark" href="https://meretniemimusic.fi/">Meretniemi</a>
  </header>

  <main class="wrap">
    <div class="card">
      <p class="eyebrow">Kuuntele</p>

      <div class="cover">
        <img src="/kuvat/kansi.jpg" alt="Kauneinta mitä sus on – singlen kansi"
             onerror="this.style.visibility='hidden'">
      </div>

      <!-- MUUTA: biisin nimi -->
      <h1 class="song">Kauneinta mitä sus on</h1>

      <p class="intro">Voi kun et himmentäisi enää tota loistoa sussa<br>
        ei sinivuokkokaan voi elää terälehdet nupussa</p>

      <div class="player">
        <button class="play" id="play" aria-label="Toista" aria-pressed="false">
          <svg class="ico-play"  viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
          <svg class="ico-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
        </button>

        <div class="meter">
          <div class="bar" id="bar" role="slider" tabindex="0"
               aria-label="Kohta laulussa" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="fill" id="fill"></div>
            <div class="knob" id="knob"></div>
          </div>
          <div class="times">
            <span id="cur">0:00</span>
            <span id="dur">–:––</span>
          </div>
        </div>
      </div>

      <p class="release">
        <!-- MUUTA: julkaisupäivä -->
        Julkaisupäivä 21. elokuuta 2026.<br>
        <a class="link-out" href="https://ffm.to/eooaa7e">Suoratoistopalvelut</a>
      </p>
    </div>
  </main>

  <footer class="foot">Meretniemi · Has Been Records</footer>

  <!-- controlsList/nodownload piilottaa selaimen lataa-napin; ei este osaajalle,
       mutta pitää sivun siistinä. Varsinainen audio on piilossa. -->
  <audio id="audio" preload="metadata" controlsList="nodownload"
         oncontextmenu="return false" style="display:none">
    <!-- MUUTA: audiotiedoston polku -->
    <source src="kauneinta.mp3" type="audio/mpeg">
  </audio>

<script>
(function(){
  const a    = document.getElementById('audio');
  const play = document.getElementById('play');
  const bar  = document.getElementById('bar');
  const fill = document.getElementById('fill');
  const knob = document.getElementById('knob');
  const curEl= document.getElementById('cur');
  const durEl= document.getElementById('dur');

  const fmt = s => {
    if(!isFinite(s)) return '–:––';
    s = Math.max(0, Math.floor(s));
    return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
  };
  const setUI = pct => {
    pct = Math.min(100, Math.max(0, pct));
    fill.style.width = pct + '%';
    knob.style.left  = pct + '%';
    bar.setAttribute('aria-valuenow', Math.round(pct));
  };

  play.addEventListener('click', () => { a.paused ? a.play() : a.pause(); });

  a.addEventListener('play',  () => {
    document.body.classList.add('playing');
    play.setAttribute('aria-pressed','true');
    play.setAttribute('aria-label','Keskeytä');
  });
  a.addEventListener('pause', () => {
    document.body.classList.remove('playing');
    play.setAttribute('aria-pressed','false');
    play.setAttribute('aria-label','Toista');
  });
  a.addEventListener('loadedmetadata', () => { durEl.textContent = fmt(a.duration); });
  a.addEventListener('timeupdate', () => {
    curEl.textContent = fmt(a.currentTime);
    if(a.duration) setUI(a.currentTime / a.duration * 100);
  });
  a.addEventListener('ended', () => setUI(0));

  // Kelaus: klikkaus + veto
  const seekTo = clientX => {
    const r = bar.getBoundingClientRect();
    const pct = (clientX - r.left) / r.width;
    if(a.duration){ a.currentTime = Math.min(1, Math.max(0, pct)) * a.duration; }
  };
  let dragging = false;
  bar.addEventListener('pointerdown', e => {
    dragging = true; bar.setPointerCapture(e.pointerId); seekTo(e.clientX);
  });
  bar.addEventListener('pointermove', e => { if(dragging) seekTo(e.clientX); });
  bar.addEventListener('pointerup',   () => { dragging = false; });

  // Näppäimistö: bar fokuksessa nuolet kelaavat
  bar.addEventListener('keydown', e => {
    if(!a.duration) return;
    const step = a.duration / 20;
    if(e.key === 'ArrowRight'){ a.currentTime = Math.min(a.duration, a.currentTime + step); e.preventDefault(); }
    if(e.key === 'ArrowLeft') { a.currentTime = Math.max(0, a.currentTime - step); e.preventDefault(); }
  });

  // Väli toistaa/keskeyttää (paitsi kun fokus on kelauspalkissa)
  document.addEventListener('keydown', e => {
    if(e.code === 'Space' && e.target !== bar){ e.preventDefault(); a.paused ? a.play() : a.pause(); }
  });
})();
</script>
</body>
</html>
