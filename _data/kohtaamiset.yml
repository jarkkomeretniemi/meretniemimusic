  kuvaus: "Me istuttiin alas Suomipopin juontajanakin tunnetun Satu Kotosen kanssa. Vuosia sitten sain biisisessiossa Satulta kokonaisen kuivakakun kotiin vietäväksi. Sen mukana tulleen vuoan palauttaminen unohtui seuraavalla viikolla. Ja sitä seuraavalla. Lopulta Satu sai vuoan takaisin vasta tämän podcastin nauhoituksissa, yli neljän vuoden jälkeen 😬 Puhuttiin lapsuudessa alkunsa saaneesta häpeästä, läheisriippuvuudesta, avioerosta ja siitä, miksi rohkenin ryhtyä artistiksi vasta 49-vuotiaana."
