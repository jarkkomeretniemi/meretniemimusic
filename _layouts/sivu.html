<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }}</title>
<meta name="description" content="{{ page.description }}">
{% if page.noindex %}<meta name="robots" content="noindex">
{% endif %}<link rel="canonical" href="https://meretniemimusic.fi/{{ page.path }}">
<meta property="og:site_name" content="Meretniemi">
<meta property="og:locale" content="fi_FI">
<meta property="og:type" content="{{ page.og_tyyppi | default: 'website' }}">
<meta property="og:url" content="https://meretniemimusic.fi/{{ page.path }}">
<meta property="og:title" content="{{ page.title }}">
<meta property="og:description" content="{{ page.description }}">
<meta property="og:image" content="https://meretniemimusic.fi/{{ page.kuva | default: 'kuvat/kansi.jpg' }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.title }}">
<meta name="twitter:description" content="{{ page.description }}">
<meta name="twitter:image" content="https://meretniemimusic.fi/{{ page.kuva | default: 'kuvat/kansi.jpg' }}">
<meta name="theme-color" content="#FBFAF8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
{% if page.jsonld %}<script type="application/ld+json">
{{ page.jsonld }}</script>
{% endif %}<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tyyli.css">
</head>
<body>
{{ content }}
{% include alatunniste.html %}

<script src="sivu.js"></script>
{% if page.kit %}<!-- Kitin skripti: lomake lähettää sivua vaihtamatta -->
<script src="https://f.convertkit.com/ckjs/ck.5.js"></script>
{% endif %}</body>
</html>
